stages:
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

tests-python:
  stage: test
  image: python:3.12
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: pip
    paths:
      - .cache/pip
  script:
    - pip install -e ".[dev]"
    - pytest -v

# Temporal: verifica si los runners permiten Docker y si hay registro
explorar-docker:
  stage: test
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  allow_failure: true
  timeout: 10 minutes
  script:
    - echo "Registro del proyecto -> ${CI_REGISTRY_IMAGE:-NO HABILITADO}"
    - docker info
    - docker run --rm hello-world
